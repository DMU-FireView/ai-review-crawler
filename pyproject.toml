[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-crawler"
version = "0.1.0"
description = "커머스 플랫폼 상품/리뷰 수집 모듈"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "playwright>=1.47",
    "typer>=0.12",
    "questionary>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
crawler = "review_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/review_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]